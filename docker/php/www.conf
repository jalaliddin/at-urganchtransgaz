; AT.urtg.uz — PHP-FPM pool. The master runs as a non-root user, so no user/group here.
[www]
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
ping.path = /ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
