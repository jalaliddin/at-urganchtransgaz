# Laravel endpoints → PHP-FPM (the edge nginx does not need the PHP files).
# /docs (OpenAPI UI) loads its viewer from unpkg.com, so it gets its own CSP.
location ^~ /docs {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'" always;
    include /etc/nginx/snippets/fastcgi-laravel.conf;
}

location ~ ^/(api|sanctum|up)(/|$) {
    include /etc/nginx/snippets/fastcgi-laravel.conf;
}
