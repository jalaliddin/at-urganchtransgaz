# AT.urtg.uz — production / staging overrides (code baked into images, TLS, no published DB)

x-backend-prod: &backend-prod
  build:
    target: prod
  image: aturtg-backend:${IMAGE_TAG:-latest}
  volumes:
    - app-storage:/var/www/html/storage/app

services:
  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - acme-webroot:/var/www/acme:ro

  frontend:
    build:
      target: prod
    image: aturtg-frontend:${IMAGE_TAG:-latest}

  backend:
    <<: *backend-prod
    environment:
      RUN_MIGRATIONS: "true"

  queue-worker: *backend-prod
  scheduler: *backend-prod

volumes:
  app-storage:
  acme-webroot:
